[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmweaver"
version = "1.0.0"
description = "Deterministic Multi-Agent DAG Orchestrator, File-Scope Lease Conflict Guard & Crash-Safe Checkpoint Resume Engine (with MCP Server)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphere-u@users.noreply.github.com" }
]
keywords = [
    "ai-agents",
    "multi-agent-systems",
    "dag-orchestrator",
    "mcp",
    "model-context-protocol",
    "agent-swarm",
    "checkpointing",
    "concurrency-control",
    "python",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
swarmweaver = "swarmweaver.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/swarmweaver"
Repository = "https://github.com/codesphere-u/swarmweaver"
Issues = "https://github.com/codesphere-u/swarmweaver/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarmweaver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
