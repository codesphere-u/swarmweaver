name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Static type check with mypy
        run: mypy swarmweaver api

      - name: Run pytest suite with coverage gate
        run: pytest -v --cov=swarmweaver --cov-report=term-missing --cov-fail-under=85

      - name: Run live HTTP & MCP smoke test
        run: python scripts/smoke_test.py

      - name: Run multi-agent crash-resume swarm demo
        run: swarmweaver demo

      - name: Run reproducible benchmark suite
        run: swarmweaver benchmark --json > /dev/null
